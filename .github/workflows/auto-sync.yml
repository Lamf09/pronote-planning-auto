name: Pronote Planning Auto-Sync

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Diagnostic Pawnote (liste les exports réels)
        run: |
          node -e "import('pawnote').then(m => { const k = Object.keys(m); console.log('EXPORTS PAWNOTE:', JSON.stringify(k)); const d = m.default ? Object.keys(m.default) : []; console.log('DEFAULT:', JSON.stringify(d)); }).catch(e => { console.error('IMPORT FAIL:', e.message); process.exit(1); })"

      - name: Run sync
        run: node auto-sync-final.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
