name: Pronote Planning Auto-Sync

on:
  schedule:
    - cron: '0 */3 * * *'  # Toutes les 3h
  workflow_dispatch:  # Lancement manuel

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Node.js 20 (compatible avec axios)

      - name: Install dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pronotepy
        run: pip install pronotepy

      - name: Run sync
        run: node auto-sync-final.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
