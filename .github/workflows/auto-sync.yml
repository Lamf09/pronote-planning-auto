name: Pronote Planning Auto-Sync

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pronotepy
        run: pip install pronotepy

      - name: Run sync (avec capture des logs)
        run: |
          echo "=== DEBUT DES LOGS ==="
          node auto-sync-final.js 2>&1 | tee sync.log
          echo "=== FIN DES LOGS ==="
          cat sync.log
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}

      - name: Upload logs en artifact (pour debug)
        if: always()
        uses: actions/upload-artifact@v4  # <-- CORRECTION : v4 au lieu de v3
        with:
          name: sync-logs
          path: sync.log
          if-no-files-found: warn
